[package]
name = "claude-toolkit"
version = "0.1.0"
edition = "2024"
description = "Claude Code hooks toolkit for enhanced development workflow"
authors = ["DeepBrain Space"]
license = "MIT"

[lints.clippy]
# Deny all clippy warnings in CI/production
all = "deny"

[lints.rust]
# Deny all compiler warnings in CI/production  
warnings = "deny"

[[bin]]
name = "claude-toolkit"
path = "src/main.rs"

# Optimization for smaller binary size
[profile.release]
opt-level = "z"  # Optimize for size
lto = true       # Link Time Optimization
codegen-units = 1
panic = "abort"  # Remove panic handling code
strip = true     # Remove debug symbols

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.45", features = ["rt", "rt-multi-thread", "macros", "process", "fs", "io-util"] }  # Latest stable tokio version per Context7
anyhow = "1.0"
colored = "2.2"

[dev-dependencies]
tempfile = "3.8"
